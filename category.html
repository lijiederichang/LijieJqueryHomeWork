<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类浏览 - 媒体卡片墙</title>
    <link rel="stylesheet" href="styles.css">
    <script src="jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>🎨 媒体卡片墙</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="category.html" class="active">分类</a></li>
                <li><a href="add-card.html">添加卡片</a></li>
                <li><a href="favorites.html">我的喜欢</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
        </div>
    </nav>

    <!-- 分类页面内容 -->
    <div class="container">
        <div class="category-page">
            <h2 class="page-title">分类浏览</h2>
            <div class="category-tabs">
                <button class="category-tab active" data-category="all">全部</button>
                <button class="category-tab" data-category="technology">科技</button>
                <button class="category-tab" data-category="art">艺术</button>
                <button class="category-tab" data-category="nature">自然</button>
                <button class="category-tab" data-category="sports">运动</button>
                <button class="category-tab" data-category="music">音乐</button>
                <button class="category-tab" data-category="game">游戏</button>
            </div>
            <div id="categoryCardsContainer" class="cards-grid">
                <!-- 卡片将通过jQuery动态生成 -->
            </div>
        </div>
    </div>

    <!-- 按依赖顺序加载JS文件 -->
    <script src="js/config.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/demo-storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/card.js"></script>
    <script src="js/like.js"></script>
    <script src="js/category.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
