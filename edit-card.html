<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑卡片 - 媒体卡片墙</title>
    <link rel="stylesheet" href="styles.css">
    <script src="jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>🎨 媒体卡片墙</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="category.html">分类</a></li>
                <li><a href="add-card.html">添加卡片</a></li>
                <li><a href="favorites.html">我的喜欢</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
        </div>
    </nav>

    <!-- 表单区域 -->
    <div class="container">
        <div class="form-container">
            <h2 class="form-title">编辑卡片</h2>
            <form id="cardForm" class="card-form">
                <div class="form-group">
                    <label for="cardTitle">卡片标题 <span class="required">*</span></label>
                    <input type="text" id="cardTitle" name="title" required placeholder="请输入卡片标题">
                </div>

                <div class="form-group">
                    <label for="cardDescription">卡片描述 <span class="required">*</span></label>
                    <textarea id="cardDescription" name="description" rows="5" required placeholder="请输入卡片描述内容"></textarea>
                </div>

                <div class="form-group">
                    <label for="cardImage">更换图片（可选）</label>
                    <input type="file" id="cardImage" name="image" accept="image/*">
                    <small class="form-hint">支持 JPG、PNG、GIF 格式，最大 5MB。不选择则保留原图片</small>
                    <div id="imagePreview" class="image-preview"></div>
                    <div id="currentImage" class="current-image"></div>
                </div>

                <div class="form-group">
                    <label for="cardCategory">分类 <span class="required">*</span></label>
                    <select id="cardCategory" name="category" required>
                        <option value="">请选择分类</option>
                        <option value="technology">科技</option>
                        <option value="art">艺术</option>
                        <option value="nature">自然</option>
                        <option value="sports">运动</option>
                        <option value="music">音乐</option>
                        <option value="game">游戏</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cardAuthor">作者</label>
                    <input type="text" id="cardAuthor" name="author" placeholder="请输入作者名称">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">保存修改</button>
                    <button type="button" id="cancelBtn" class="btn-secondary">取消</button>
                </div>
            </form>

            <div id="formMessage" class="form-message"></div>
        </div>
    </div>

    <!-- 按依赖顺序加载JS文件 -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/form.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
